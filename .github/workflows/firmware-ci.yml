name: firmware-ci
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install clang-format-18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
      - name: check format
        run: |
          find firmware -name '*.cpp' -o -name '*.h' -o -name '*.c' \
            | grep -v 'firmware/kernel/' \
            | grep -v 'firmware/third_party/' \
            | xargs clang-format-18 --dry-run --Werror

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: setup ubuntu
        run: |
          sudo apt update
          sudo apt install -y cmake build-essential wget unzip gcc-arm-none-eabi
      - name: setup mtkernel
        working-directory: ./firmware/kernel
        run: |
          PASSWORD=${{ secrets.ZIP_PASSWORD }}
          wget https://www.personal-media.co.jp/book/tw/data/362_mbit_mtk3.zip
          unzip -P $PASSWORD 362_mbit_mtk3.zip
      - name: build main
        working-directory: ./firmware
        run: |
          make build
      - name: build updater
        working-directory: ./firmware
        run: |
          make build-updater
      - name: build factory-test
        working-directory: ./firmware
        run: |
          make build-factory-test

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: setup ubuntu
        run: |
          sudo apt update
          sudo apt install -y cmake build-essential
      - name: run tests
        working-directory: ./firmware
        run: make test