name: firmware-ci
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install clang-format-18
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-18
      - name: check C/C++ format
        shell: bash
        run: |
          set -euo pipefail
          find firmware -type f \
            \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' \
               -o -name '*.h' -o -name '*.hh' -o -name '*.hpp' \) \
            -not -path '*/kernel/*' \
            -not -path '*/third_party/*' \
            -not -path '*/build/*' \
            -print0 \
            | xargs -0 -r clang-format-18 --dry-run --Werror

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: setup ubuntu
        run: |
          sudo apt update
          sudo apt install -y cmake build-essential wget unzip gcc-arm-none-eabi
      - name: setup mtkernel
        working-directory: ./firmware/kernel
        run: |
          PASSWORD=${{ secrets.ZIP_PASSWORD }}
          wget https://www.personal-media.co.jp/book/tw/data/362_mbit_mtk3.zip
          unzip -P $PASSWORD 362_mbit_mtk3.zip
      - name: build main
        working-directory: ./firmware
        run: |
          make build-all

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: setup ubuntu
        run: |
          sudo apt update
          sudo apt install -y cmake build-essential
      - name: run tests
        working-directory: ./firmware
        run: make test
