name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Checkout uai-bridge
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/uai-bridge
          path: ../uai-bridge

      - name: Install CMake (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake g++

      - name: Configure CMake
        run: cmake -B build -S firmware -DUAI_PLATFORM=SIM

      - name: Build
        run: cmake --build build --config Debug

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install scikit-learn numpy

      - name: Verify host imports
        run: python -c "import host.model"
        working-directory: .
